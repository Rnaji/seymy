databases:
  - name: seymy-db
    plan: free
    databaseName: seymy
    user: seymy

services:
  - type: web
    plan: free
    name: seymy
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seymy-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: "seymy.com,www.seymy.com"
      - key: WEB_CONCURRENCY
        value: 4
